<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500" font-family="Roboto Condensed, Arial Narrow, Helvetica, Arial, sans-serif">
<title>Skimmer for Linux — the signal from the Red Pitaya to the telnet feed</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fb0c4"/></marker></defs>
<style>.t{font-size:16px;font-weight:700;fill:#e6edf5}.d{font-size:13px;fill:#9fb0c4}.f{font-size:12.5px;fill:#5fc8ff;font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace}.l{font-size:12px;fill:#6a7d96}.n{font-size:12px;font-weight:700;fill:#0b1420}.h{font-size:12px;font-weight:700;letter-spacing:2px;fill:#39d98a}.k{font-size:12px;fill:#6a7d96}</style>
<rect width="1000" height="1500" fill="#0b1420"/>
<text x="40" y="30" class="h">THE SIGNAL, FROM THE ANTENNA TO THE TELNET FEED</text>
<text x="40" y="48" class="k">each box names the code it runs in — open this picture on its own to follow the links</text>
<rect x="40" y="66" width="600" height="62" rx="6" fill="#1a283a" stroke="#6a7d96" stroke-width="1.4"/>
<text x="54" y="90" class="t">Red Pitaya — sdr_receiver_hpsdr (Pavel Demin)</text>
<text x="54" y="110" class="d">the skimmer's own receiver: up to 8 DDCs, one band each, 48 / 96 / 192 kHz</text>
<line x1="100" y1="128" x2="100" y2="166" stroke="#9fb0c4" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="114" y="151.0" class="l" text-anchor="start">UDP, HPSDR Protocol 1 — 24-bit IQ of every receiver, ~4400 packets/s</text>
<rect x="40" y="166" width="600" height="96" rx="6" fill="#111d2b" stroke="#39d98a" stroke-width="1.4"/>
<circle cx="58" cy="185" r="10" fill="#39d98a"/>
<text x="58" y="189" text-anchor="middle" class="n">1</text>
<text x="76" y="190" class="t">IQ in</text>
<text x="54" y="210" class="d">finds an idle radio, sets centres / rate / receivers, never keys; the wire is</text>
<text x="54" y="227" class="d">RF-inverted, so it is conjugated here; clock correction (ppm)</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/engine/hpsdr_p1.c" target="_blank"><text x="54" y="244" class="f">src/engine/hpsdr_p1.c</text></a>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/headless/source_hpsdr_p1.c" target="_blank"><text x="231.6" y="244" class="f">src/headless/source_hpsdr_p1.c</text></a>
<line x1="100" y1="262" x2="100" y2="296" stroke="#9fb0c4" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="40" y="296" width="600" height="80" rx="6" fill="#111d2b" stroke="#39d98a" stroke-width="1.4"/>
<circle cx="58" cy="315" r="10" fill="#39d98a"/>
<text x="58" y="319" text-anchor="middle" class="n">2</text>
<text x="76" y="320" class="t">Bands out — one IQ block of each receiver</text>
<text x="54" y="340" class="d">to the pipelines of its band (CW, and RTTY beside it on the same IQ)</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/headless_main.c" target="_blank"><text x="54" y="357" class="f">src/headless_main.c — rx_iq_cb()</text></a>
<rect x="680" y="168" width="285" height="76" rx="6" fill="#111d2b" stroke="#2f4560" stroke-width="1.4"/>
<text x="694" y="192" class="t">Waterfall + listening</text>
<text x="694" y="212" class="d">FFT 8192 while someone watches; CW audio</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/headless/waterfall.c" target="_blank"><text x="694" y="229" class="f">src/headless/waterfall.c</text></a>
<rect x="680" y="256" width="285" height="76" rx="6" fill="#111d2b" stroke="#2f4560" stroke-width="1.4"/>
<text x="694" y="280" class="t">Hub → worker PCs</text>
<text x="694" y="300" class="d">a band's IQ to another PC (int24, TCP)</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/headless/hub.c" target="_blank"><text x="694" y="317" class="f">src/headless/hub.c</text></a>
<rect x="680" y="344" width="285" height="76" rx="6" fill="#111d2b" stroke="#2f4560" stroke-width="1.4"/>
<text x="694" y="368" class="t">IQ recording</text>
<text x="694" y="388" class="d">raw IQ to disk, for replays</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/headless/record.c" target="_blank"><text x="694" y="405" class="f">src/headless/record.c</text></a>
<path d="M640,336 C660,336 660,206 678,206" fill="none" stroke="#6a7d96" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<path d="M640,336 C660,336 660,294 678,294" fill="none" stroke="#6a7d96" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<path d="M640,336 C660,336 660,382 678,382" fill="none" stroke="#6a7d96" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<line x1="100" y1="376" x2="100" y2="414" stroke="#9fb0c4" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="26" y="414" width="628" height="790" rx="10" fill="none" stroke="#2f4560" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="40" y="436" class="h">ONE PIPELINE PER BAND AND MODE — ITS OWN THREAD</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/engine/pipeline.c" target="_blank"><text x="444" y="436" class="f">src/engine/pipeline.c</text></a>
<rect x="40" y="450" width="600" height="96" rx="6" fill="#111d2b" stroke="#39d98a" stroke-width="1.4"/>
<circle cx="58" cy="469" r="10" fill="#39d98a"/>
<text x="58" y="473" text-anchor="middle" class="n">3</text>
<text x="76" y="474" class="t">Channelizer</text>
<text x="54" y="494" class="d">a polyphase filter bank: the band in narrow complex channels, phase kept —</text>
<text x="54" y="511" class="d">CW 125 Hz apart (768 channels in 96 kHz), RTTY 250 Hz (384)</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/engine/channelizer.c" target="_blank"><text x="54" y="528" class="f">src/engine/channelizer.c</text></a>
<line x1="100" y1="546" x2="100" y2="578" stroke="#9fb0c4" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="114" y="566" class="l" text-anchor="start">every channel, also into its noise floor and SNR —</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/engine/snr_meter.c" target="_blank"><text x="392" y="566" class="f">src/engine/snr_meter.c</text></a>
<circle cx="58" cy="596" r="10" fill="#39d98a"/><text x="58" y="600" text-anchor="middle" class="n">4</text>
<text x="76" y="601" class="t">Decoders — one per channel, text with its confidence</text>
<rect x="40" y="614" width="192" height="112" rx="6" fill="#111d2b" stroke="#8fb9ff" stroke-width="1.4"/>
<text x="52" y="636" class="t" fill="#8fb9ff" style="fill:#8fb9ff">CW v3.1 (default)</text>
<text x="52" y="656" class="d">v2's Viterbi + a weak-</text>
<text x="52" y="672" class="d">signal path, call reader</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/engine/decode_cw_v3.c" target="_blank"><text x="52" y="690" class="f">decode_cw_v3.c</text></a>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/engine/cw_reader.c" target="_blank"><text x="52" y="705" class="f">cw_reader.c</text></a>
<rect x="244" y="614" width="192" height="112" rx="6" fill="#111d2b" stroke="#8fb9ff" stroke-width="1.4"/>
<text x="256" y="636" class="t" fill="#8fb9ff" style="fill:#8fb9ff">CW v2 · DeepCW</text>
<text x="256" y="656" class="d">semi-Markov Viterbi;</text>
<text x="256" y="672" class="d">or the neural model</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/engine/decode_cw_v2.c" target="_blank"><text x="256" y="690" class="f">decode_cw_v2.c</text></a>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/engine/decode_deepcw.c" target="_blank"><text x="256" y="705" class="f">decode_deepcw.c</text></a>
<rect x="448" y="614" width="192" height="112" rx="6" fill="#111d2b" stroke="#ffb88a" stroke-width="1.4"/>
<text x="460" y="636" class="t" fill="#ffb88a" style="fill:#ffb88a">RTTY 45.45 Bd</text>
<text x="460" y="656" class="d">Baudot FSK, 170 Hz</text>
<text x="460" y="672" class="d">shift, both polarities</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/engine/decode_rtty.c" target="_blank"><text x="460" y="690" class="f">decode_rtty.c</text></a>
<line x1="100" y1="726" x2="100" y2="754" stroke="#9fb0c4" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="114" y="744.0" class="l" text-anchor="start">a station heard in two channels at once: the weaker one dropped (ghosts)</text>
<rect x="40" y="754" width="600" height="96" rx="6" fill="#111d2b" stroke="#39d98a" stroke-width="1.4"/>
<circle cx="58" cy="773" r="10" fill="#39d98a"/>
<text x="58" y="777" text-anchor="middle" class="n">5</text>
<text x="76" y="778" class="t">Callsigns read and validated</text>
<text x="54" y="798" class="d">calls out of the running text: structure, prefixes, MASTER.SCP; torn and</text>
<text x="54" y="815" class="d">fused reads mended; CQ / TU / exchange context — RBN-grade</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/engine/callsign.c" target="_blank"><text x="54" y="832" class="f">src/engine/callsign.c</text></a>
<line x1="100" y1="850" x2="100" y2="878" stroke="#9fb0c4" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="40" y="878" width="600" height="80" rx="6" fill="#111d2b" stroke="#39d98a" stroke-width="1.4"/>
<circle cx="58" cy="897" r="10" fill="#39d98a"/>
<text x="58" y="901" text-anchor="middle" class="n">6</text>
<text x="76" y="902" class="t">Callsign filter (Settings)</text>
<text x="54" y="922" class="d">a call that does not pass is gone here: no spot, no map dot, no statistics</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/headless/config.c" target="_blank"><text x="54" y="939" class="f">src/headless/config.c — skim_hd_config_call_pass()</text></a>
<line x1="100" y1="958" x2="100" y2="986" stroke="#9fb0c4" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="40" y="986" width="600" height="80" rx="6" fill="#111d2b" stroke="#39d98a" stroke-width="1.4"/>
<circle cx="58" cy="1005" r="10" fill="#39d98a"/>
<text x="58" y="1009" text-anchor="middle" class="n">7</text>
<text x="76" y="1010" class="t">Station table</text>
<text x="54" y="1030" class="d">one record per station: frequency snapped at 100 Hz, held 30 s, SNR, WPM</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/engine/station.c" target="_blank"><text x="54" y="1047" class="f">src/engine/station.c</text></a>
<line x1="100" y1="1066" x2="100" y2="1094" stroke="#9fb0c4" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="40" y="1094" width="600" height="96" rx="6" fill="#111d2b" stroke="#39d98a" stroke-width="1.4"/>
<circle cx="58" cy="1113" r="10" fill="#39d98a"/>
<text x="58" y="1117" text-anchor="middle" class="n">8</text>
<text x="76" y="1118" class="t">Feed policy</text>
<text x="54" y="1138" class="d">CQ only; heard enough times; unknown calls wait 60 s; a near-call bust folded</text>
<text x="54" y="1155" class="d">into the real call; the learned gate scores every line</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/engine/feed_fold.c" target="_blank"><text x="54" y="1172" class="f">src/engine/feed_fold.c</text></a>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/engine/feed_gate.c" target="_blank"><text x="239.2" y="1172" class="f">src/engine/feed_gate.c</text></a>
<line x1="100" y1="1190" x2="100" y2="1240" stroke="#9fb0c4" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="114" y="1228" class="l" text-anchor="start">the CQ spots of every band and mode</text>
<rect x="40" y="1240" width="600" height="96" rx="6" fill="#111d2b" stroke="#39d98a" stroke-width="1.4"/>
<circle cx="58" cy="1259" r="10" fill="#39d98a"/>
<text x="58" y="1263" text-anchor="middle" class="n">9</text>
<text x="76" y="1264" class="t">The feed</text>
<text x="54" y="1284" class="d">one feed for all bands: spots of other skimmers (peers, workers) merged,</text>
<text x="54" y="1301" class="d">duplicates dropped, a station re-spotted only after 10 min or a QSY</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/engine/rbn_feed.c" target="_blank"><text x="54" y="1318" class="f">src/engine/rbn_feed.c</text></a>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/headless/peers.c" target="_blank"><text x="231.6" y="1318" class="f">src/headless/peers.c</text></a>
<line x1="187" y1="1336" x2="187" y2="1370" stroke="#9fb0c4" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="493" y1="1336" x2="493" y2="1370" stroke="#9fb0c4" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="40" y="1370" width="294" height="66" rx="6" fill="#0f2a1e" stroke="#39d98a" stroke-width="2"/>
<text x="54" y="1395" class="t" style="fill:#39d98a">Telnet cluster feed <tspan class="d">:7300</tspan></text>
<text x="54" y="1417" class="d">DX de CALL-#: … CW 25 dB 22 WPM CQ</text>
<rect x="346" y="1370" width="294" height="66" rx="6" fill="#0f2a1e" stroke="#39d98a" stroke-width="2"/>
<text x="360" y="1395" class="t" style="fill:#39d98a">RBN Aggregator <tspan class="d">:7550</tspan></text>
<text x="360" y="1417" class="d">to reversebeacon.net, under your call</text>
<rect x="680" y="1230" width="285" height="76" rx="6" fill="#111d2b" stroke="#2f4560" stroke-width="1.4"/>
<text x="694" y="1254" class="t">Web page — map, DX cluster</text>
<text x="694" y="1274" class="d">the last 30 min (/api/spots)</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/headless/web.c" target="_blank"><text x="694" y="1291" class="f">src/headless/web.c</text></a>
<rect x="680" y="1318" width="285" height="76" rx="6" fill="#111d2b" stroke="#2f4560" stroke-width="1.4"/>
<text x="694" y="1342" class="t">Statistics</text>
<text x="694" y="1362" class="d">per band and mode, two years</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/headless/stats.c" target="_blank"><text x="694" y="1379" class="f">src/headless/stats.c</text></a>
<rect x="680" y="1406" width="285" height="76" rx="6" fill="#111d2b" stroke="#2f4560" stroke-width="1.4"/>
<text x="694" y="1430" class="t">Spot archive</text>
<text x="694" y="1450" class="d">a gzip file a UTC day</text>
<a href="https://github.com/ok1hra/skimmer-for-linux/blob/main/src/headless/archive.c" target="_blank"><text x="694" y="1467" class="f">src/headless/archive.c</text></a>
<path d="M640,1288 C660,1288 660,1268 678,1268" fill="none" stroke="#6a7d96" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<path d="M640,1288 C660,1288 660,1356 678,1356" fill="none" stroke="#6a7d96" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<path d="M640,1288 C660,1288 660,1444 678,1444" fill="none" stroke="#6a7d96" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="680" y="1220" class="l">every spot sent, as it goes out (the feed's tap)</text>
</svg>
