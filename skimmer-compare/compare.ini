# compare-web.py — configuration. Paths are relative to this file; ~ expands.

[paths]
logs = logs
# the local skimmer's own config: its [radio] rate and [bands] centres give
# the local frequency windows (centre +- rate/2)
headless_ini = ~/.config/skimmer-for-linux/headless.ini
# callsign database, the referee when RBN has nothing to say
scp = ~/.config/skimmer-for-linux/master.scp

[local]
# L on the page, the Linux skimmer: skimmer-headless, its telnet feed recorded as "local".
# about = shown on the public page: no addresses
name = Skimmer for Linux (OK1BR)
about = skimmer-headless by OK1BR, 7 bands × 96 kHz from its own Red Pitaya, spots only stations heard calling (CQ/TEST/QRZ) with a callsign score of at least 0.85, again after 10 min or a QSY of more than 100 Hz
# the decoder of recordings whose status snapshots do not name it (everything
# recorded before skimmer-headless reported "engine" in /status.json)
default_engine = cw-v2
# what [local filter] below leaves out, in words (the page shows it)
filter_about = Russian and Belarusian calls left out

[remote]
# W on the page, the Windows skimmer: CW Skimmer Server, recorded as "remote"
name = CW Skimmer Server (VE3NEA)
about = CW Skimmer Server 1.6 by VE3NEA on Windows, its own Red Pitaya, marks spots CQ, DE or nothing — only its CQ spots are compared
# what R can spot without [remote windows] below, kHz
windows = 1800-1891 3500-3591 7000-7091 10100-10150 14000-14091 18068-18159 21000-21091 28000-28091

[remote windows]
# What R can spot, from the given UTC time on until the next line: its
# receiver span (SkimSrv.ini CenterFreqs96 ± 45.5 kHz) cut to its CW
# segments (CwSegments) — CW Skimmer Server spots nothing outside them, so
# an L spot there is no miss of R. Until 2026-10-08 the segments left a hole
# at 7035–7045 and stopped at 3570, 10130, 14070, 18095, 21070 kHz.
2022-01-01 = 1800-1870 3500-3570 7000-7035 7045-7070 10100-10130 14000-14070 18068-18095 21000-21070 28000-28070
# SkimSrv restarted with CwSegments = the whole amateur bands: its receiver spans, cut at the band edge
2026-10-08T20:44:09 = 1800-1891 3500-3591 7000-7091 10100-10150 14000-14091 18068-18159 21000-21091 28000-28091

[local filter]
# skimmer-headless's callsign filter ([filter] call / regex in headless.ini),
# from the given UTC time on until the next line; empty = no filter. CW
# Skimmer Server has none, so inside a filter's time a spot of EITHER side
# whose call it refuses is left out of the comparison — a call L may not
# spot is no miss of L. Matched as headless does: a caseless regex search.
# A plain (regex=false) call is a substring: write it escaped here.
# compare warns at start when headless.ini filters with something else.
2022-01-01 =
# switched on with the settings saved 2026-11-19 20:32:39Z (L reconnected;
# its last RU/BY spot 20:28:27Z): IP-rotator's RU/BY-out default
2026-11-19T20:32:39 = ^(?!^(?:R[A-Z]?|U[A-I0]|E[UVW])[0-9]{1,3}[A-Z]{1,4}(?:/[A-Z0-9]+)?$).+

[engines]
# decoder name as skimmer-headless reports it = label | what it is
cw-v2 = decoder v2 | classical: semi-Markov Viterbi over the keying states
cw-v3 = decoder v3 | classical: v2's lattice behind a carrier-matched front end, calibrated LLRs and audio-confirmed calls
cw-v3.1 = decoder v3.1 | v3 with the precision rules: the reader's call must beat the text's own readings, unsupported corrections read twice, a head yields to its longer call
deepcw = DeepCW | neural: Conformer + CTC, ONNX Runtime
cw-v1 = decoder v1 | classical v1
# a non-wide decode path is a decoder of its own ([decode] path= in headless.ini)
cw-v2+both = decoder v2 + narrow path | v2 with the narrow carrier-centred path beside the wide one ([decode] path=both)
cw-v2+narrow = decoder v2, narrow only | v2 on the narrow carrier-centred path alone ([decode] path=narrow)
cw-v2+split = decoder v2 + tone splitter | v2 with the tone splitter, no focus slot

[rbn]
# our own spotter call(s): never let a skimmer confirm itself through RBN
exclude = OK1HRA

[web]
# the public page: the current session, its numbers recomputed every every_s
listen = 0.0.0.0
port = 8075
every_s = 60

[match]
# the matching parameters (skimcmp/config.py lists them with their meaning)
gap_min = 20
slack_min = 5
df_khz = 1.5
bust_df_hz = 300
bust_dt_s = 120
bust_edit = 2
guard_khz = 0.5
rbn_win_min = 10
rbn_df_khz = 1.0
lost_pct = 1.0
silence_min = 15
silence_other = 5
