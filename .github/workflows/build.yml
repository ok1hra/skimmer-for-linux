# CI — runs at RELEASE time only (no CI on every commit; the local gates
# cover development): build + all offline engine gates on v* tags, external
# pull requests and manual dispatch. The golden gate SKIPs here — its real-air
# inputs live on hra2 (tests/golden/README.md).
#
# skimmer-for-linux is headless since the GUI was removed; the AppImage job
# (Debian 12 base) comes with packaging/appimage — the GTK AppImage, .deb and
# .rpm jobs went with the GUI.
name: build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive
  APT_DEPS: >-
    meson ninja-build libglib2.0-dev libwebsockets-dev libfftw3-dev
    libcurl4-openssl-dev

jobs:
  gates:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_DEPS
      - name: Build
        run: |
          meson setup build
          meson compile -C build
      - name: Offline gates
        run: meson test -C build --print-errorlogs
